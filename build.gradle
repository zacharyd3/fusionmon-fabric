plugins {
	id 'java'
	id 'maven-publish'
	// ModDevGradle: el plugin oficial de NeoForge (lo que Loom era en Fabric). Prepara Minecraft con los nombres de
	// Mojang, que son también los del juego publicado: no hay que remapear nada (ni el jar del mod ni el de Cobblemon)
	id 'net.neoforged.moddev' version "${moddev_version}"
}

base {
	archivesName = project.mod_id
}

repositories {
	// Maven oficial de Cobblemon. Su POM trae Kotlin for Forge (y con él Kotlin) y el resto de dependencias.
	maven {
		name = "Cobblemon"
		url = "https://maven.impactdev.net/repository/development/"
	}
	// Kotlin for Forge (la versión de NeoForge de Fabric Language Kotlin): Cobblemon está escrito en Kotlin
	maven {
		name = "Kotlin for Forge"
		url = "https://thedarkcolour.github.io/KotlinForForge/"
		content { includeGroup "thedarkcolour" }
	}
}

sourceSets {
	main {
		// Lo de cliente sigue en src/client, como con Fabric, pero se compila junto con lo común: ModDevGradle no
		// separa los dos lados. Ojo: el código común no puede usar clases de cliente (en un servidor no existen),
		// ahora no lo avisa el compilador
		java.srcDir 'src/client/java'
		resources.srcDir 'src/client/resources'
	}
}

neoForge {
	version = project.neo_version

	runs {
		client {
			client()
			// Sin esto el jugador se llama "Dev" (o el que toque), y como Cobblemon guarda el equipo y el PC por
			// jugador, cambiar de nombre parece un jugador nuevo
			programArguments.addAll "--username", "Arnau"
			// Sin argumentos Java usaba G1 con el heap creciendo desde 512 MB: una pausa de ~9 ms cada ~7 s,
			// que a 240 Hz son 2-3 frames perdidos. Heap fijo + ZGC generacional: pausas < 1 ms. Solo afecta a runClient
			jvmArguments.addAll "-Xms8G", "-Xmx8G", "-XX:+UseZGC", "-XX:+ZGenerational"
		}
		server {
			server()
			programArgument "--nogui"
			// Carpeta propia: cliente y servidor se lanzan a la vez y si no compartirían
			// logs, configuración y mundo en run/
			gameDirectory = project.file("run/server")
		}
	}

	mods {
		"${mod_id}" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	implementation "com.cobblemon:neoforge:${project.cobblemon_version}"

	// El código Java usa kotlin.Unit (los eventos de Cobblemon son de Kotlin). En el juego lo pone Kotlin for
	// Forge; esto es solo para compilar, por si el POM de Cobblemon no deja Kotlin al compilar
	compileOnly "org.jetbrains.kotlin:kotlin-stdlib:${project.kotlin_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version
	// La descripción lleva "Pokémon": que no dependa del idioma del sistema
	filteringCharset = "UTF-8"

	filesMatching("META-INF/neoforge.mods.toml") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	// Los comentarios y los mensajes del log van en español: que no dependa del idioma del sistema
	it.options.encoding = "UTF-8"
}

java {
	// Gradle corre con Java 26, pero Minecraft 1.21.1 y Cobblemon exigen Java 21: ModDevGradle compila y lanza el
	// juego (runClient, runServer) con el JDK 21 de esta toolchain
	toolchain.languageVersion = JavaLanguageVersion.of(21)

	withSourcesJar()
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
